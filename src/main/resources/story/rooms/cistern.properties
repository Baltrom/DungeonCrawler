name=Die Zisterne

description.1=Eine riesige Zisterne, das Wasser schwarz und vollkommen still.
description.2=Eine morsche Bruecke fuehrt ueber das Becken, die andere Seite verschwindet im Nebel.
description.3=Im Schlamm am Rand glaenzt etwas, und im Wasser regt sich nichts.
description.4=Dein Atem steigt als weisse Wolke auf.

free.label=Die Bruecke ueber das Becken nehmen
free.text=Die Bruecke knarrt, haelt aber. Das Wasser unter dir bleibt still, und das ist das Unheimlichste daran.

obstacle.label=Die morsche Bruecke untersuchen
obstacle.text=Zwei der Bohlen sind durchgebrochen, die Seile faulen. Entweder du balancierst darueber oder du baust dir einen neuen Weg.

way.1.label=Ueber die morsche Bruecke balancieren
way.1.attribute=DEXTERITY
way.1.harder=false
way.1.success=Du setzt Fuss vor Fuss und erreichst die andere Seite, ohne dass eine Bohle bricht.
way.1.failure=Eine Bohle bricht, und du klammerst dich an die Seile. Du kommst nass und zitternd drueben an.

way.2.label=Eine neue Bruecke aus Truemmern bauen
way.2.attribute=STRENGTH
way.2.harder=true
way.2.success=Du schichtest Steine und Balken uebereinander, bis ein Weg entsteht, und erreichst das andere Ufer.
way.2.failure=Der Bau stuerzt halb ein, und du faellst ins eiskalte Wasser. Du kriechst ans Ufer.

poi.1.label=Den glaenzenden Gegenstand im Schlamm untersuchen
poi.1.text=Er liegt halb im Schlamm, und etwas an ihm sieht gepflegt aus.
poi.1.attribute=INTELLIGENCE
poi.1.effect=ITEM
poi.1.success=Du ziehst ihn vorsichtig heraus. Er ist nicht so wertlos, wie er aussah.
poi.1.failure=Der Schlamm schliesst sich darueber, und der Gegenstand versinkt.

poi.2.label=Das schwarze Wasser betrachten
poi.2.text=Es ist so still, dass du dein Spiegelbild siehst. Es blickt dich einen Atemzug zu lang an.
poi.2.follow.label=Genauer in die Tiefe schauen
poi.2.follow.text=Unter der Oberflaeche liegen helle Formen, regungslos.
poi.2.follow.attribute=INTELLIGENCE
poi.2.follow.effect=HINT
poi.2.follow.success=Es sind Knochen, sorgfaeltig angeordnet, als Warnung oder als Opfer. Du ahnst, was weiter vorne lauert.
poi.2.follow.failure=Das Spiegelbild laechelt, und du wendest dich ab.

poi.3.label=Die Ufermauer absuchen
poi.3.text=Zwischen den Steinen glaenzt feuchtes Moos, und darin klemmt etwas.
poi.3.attribute=DEXTERITY
poi.3.easier=true
poi.3.effect=INSIGHT
poi.3.damage=true
poi.3.success=Es ist ein Pergament, wasserdicht in Wachs eingeschlagen, mit der Karte eines Teils der Gruft.
poi.3.failure=Du rutschst auf dem Moos aus und schlaegst dir das Knie an.

extra.art=cistern
