name=Die Waffenkammer

description.1=Zerbrochene Schilde, rostige Klingen, umgestuerzte Waffenstaender.
description.2=Eine schwere Truhe steht unter einem Haufen Truemmer.
description.3=An der Wand haengt ein Wappen, das jemand mit Klingen zerhackt hat.
description.4=Ein eingestuerzter Gang versperrt den Weg nach vorn.

free.label=Durch den halb eingestuerzten Gang weitergehen
free.text=Der Gang ist eng, aber passierbar. Hinter dir rieselt Staub von der Decke, und ein Stein loest sich ganz leise.

obstacle.label=Den eingestuerzten Gang untersuchen
obstacle.text=Truemmer versperren den Weg, aber die Decke haelt noch. Entweder du erkennst die tragenden Steine oder du raeumst alles weg.

way.1.label=Den Einsturz der Decke genau untersuchen
way.1.attribute=INTELLIGENCE
way.1.harder=false
way.1.success=Du erkennst den Schlussstein und loest ihn behutsam, und die Truemmer rutschen von allein beiseite.
way.1.failure=Du loest den falschen Stein, und die Decke schickt dir einen Schauer Geroell. Du zwaengst dich hindurch.

way.2.label=Die Truemmer wegraeumen
way.2.attribute=STRENGTH
way.2.harder=true
way.2.success=Stein um Stein schleppst du fort, bis ein Durchgang frei ist.
way.2.failure=Ein Balken rutscht ab und trifft dich, bevor du den Durchgang frei hast.

poi.1.label=Die schwere Truhe aufbrechen
poi.1.text=Sie ist mit Eisen beschlagen, und das Schloss ist verbeult.
poi.1.attribute=STRENGTH
poi.1.effect=ITEM
poi.1.success=Das Schloss bricht, und der Deckel faellt zurueck.
poi.1.failure=Der Deckel klemmt, und du holst dir einen Splitter.

poi.2.label=Das zerhackte Wappen betrachten
poi.2.text=Das Wappen zeigt einen Koenig, und jemand hat ihn mit aller Wut aus dem Stein gehackt.
poi.2.follow.label=Die Kratzspuren am Wappen genauer ansehen
poi.2.follow.text=Sie sind alt, aber an einer Stelle frisch.
poi.2.follow.attribute=INTELLIGENCE
poi.2.follow.effect=HINT
poi.2.follow.success=Die frischen Spuren zeigen, dass jemand vor dir hier war und in die Richtung floh, in die du musst.
poi.2.follow.failure=Du erkennst nichts, und das Wappen scheint dich dabei auszulachen.

poi.3.label=Den Waffenstaender durchsuchen
poi.3.text=Zwischen den rostigen Klingen glaenzt eine, die gepflegt aussieht.
poi.3.attribute=DEXTERITY
poi.3.easier=true
poi.3.effect=INSIGHT
poi.3.damage=true
poi.3.success=Es ist die Waffe eines Waechters, und an ihr steckt ein Pergament mit der Beschreibung seiner Gewohnheiten.
poi.3.failure=Eine Klinge rutscht ab und ritzt dir den Arm.
