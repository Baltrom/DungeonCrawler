# Raum 0: vor dem Tor der Gruft. Der Durchgang ist immer frei, die Starthilfe haengt von der Klasse ab.
name=Vor dem Tor

description.1=Ein verrostetes Gitter versperrt den Eingang zur Gruft, dahinter nichts als Dunkelheit.
description.2=Kahle Baeume ragen aus dem Boden wie die Finger eines Ertrinkenden.
description.3=Der Wind traegt ein Fluestern heran, das nicht vom Wind kommt.
description.4=Der Geruch von altem Staub und kalter Erde liegt schwer in der Luft.

free.label=Das Gitter aufstossen und die Gruft betreten
free.text=Das Gitter gibt kreischend nach, und die Dunkelheit schluckt dich. Hinter dir faellt es ins Schloss.

poi.1.label=Das verrostete Gitter absuchen
poi.1.class=ROGUE
poi.1.text=Zwischen den Staeben haengt etwas, das der Rost noch nicht gefressen hat.
poi.1.attribute=DEXTERITY
poi.1.effect=ITEM
poi.1.item=PROTECTION_AMULET
poi.1.success=Du loest es behutsam: ein Schutzzeichen, das jemand vor dir hier zurueckgelassen hat.
poi.1.failure=Das Ding rutscht dir aus den Fingern und verschwindet im hohen Gras.

poi.2.label=Die Runen am Tor lesen
poi.2.class=MAGE
poi.2.text=In das Gitter sind Zeichen geaetzt, die kaum noch zu erkennen sind.
poi.2.attribute=INTELLIGENCE
poi.2.effect=ITEM
poi.2.item=CHARGE_POTION
poi.2.success=Du verstehst sie, und ein verborgenes Fach im Torpfosten springt auf.
poi.2.failure=Die Zeichen verschwimmen vor deinen Augen, und das Fach bleibt verschlossen.

poi.3.label=Einen Moment lang innehalten
poi.3.text=Du atmest die kalte Luft ein, schliesst die Augen und lauschst. Dein Herz schlaegt ruhiger.
poi.3.effect=INSIGHT

poi.4.label=Die Fusspuren im Staub betrachten
poi.4.text=Sie fuehren zum Tor und nicht wieder zurueck.
poi.4.follow.label=Den Spuren genauer folgen
poi.4.follow.text=Manche Abdruecke sind frisch, aber nur wenige.
poi.4.follow.attribute=INTELLIGENCE
poi.4.follow.effect=HINT
poi.4.follow.success=Du liest, wohin sie fuehrten und was ihnen dort begegnet ist.
poi.4.follow.failure=Der Wind verweht die Spuren, noch waehrend du sie ansiehst.

extra.art=gate
