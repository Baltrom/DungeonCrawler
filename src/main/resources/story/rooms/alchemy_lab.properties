name=Das Alchemielabor

description.1=Zerbrochene Glaskolben, getrocknete Kraeuter und ein bitterer Geruch nach Gift.
description.2=Auf einem Tisch brodelt etwas, das laengst nicht mehr brodeln sollte.
description.3=An der Wand haengen Skizzen von Koerpern, die nicht ganz menschlich sind.
description.4=Gelbe Daempfe quellen unter einer Tuer hervor.

free.label=Durch den Dunst zur naechsten Tuer gehen
free.text=Der Dunst ist duenn geworden, und die Tuer laesst sich ohne Muehe oeffnen. Du holst tief Luft und gehst hinein.

obstacle.label=Die Tuer mit den gelben Daempfen untersuchen
obstacle.text=Der Dampf kommt aus dem Schloss, und das Holz ist von Saeure zerfressen. Wer die Tuer oeffnet, atmet ein.

way.1.label=Das Schloss der Giftgas-Tuer knacken
way.1.attribute=DEXTERITY
way.1.harder=false
way.1.success=Du haeltst den Atem an, drehst den Dietrich, und die Tuer springt auf. Du huschst hindurch.
way.1.failure=Das Schloss gibt nach, und ein Schwall Dampf erfasst dich. Du taumelst hustend hindurch.

way.2.label=Die Tuer aufbrechen
way.2.attribute=STRENGTH
way.2.harder=true
way.2.success=Die zerfressene Tuer zerbricht unter deiner Schulter, und der Dampf zieht an dir vorbei.
way.2.failure=Die Tuer birst, und ein Schwall Saeure spritzt dich an. Du stolperst hindurch.

poi.1.label=Die verschlossene Schatulle auf dem Tisch oeffnen
poi.1.text=Sie steht zwischen den Kolben, und niemand hat sie je geoeffnet.
poi.1.attribute=DEXTERITY
poi.1.effect=ITEM
poi.1.success=Die Schatulle gibt nach, und etwas Kleines liegt auf Samt.
poi.1.failure=Der Deckel klemmt, und ein Tropfen Gift zischt auf deinem Handschuh.

poi.2.label=Die Skizzen an der Wand betrachten
poi.2.text=Sie zeigen einen Mann, der immer weniger Mann und immer mehr etwas anderes wird.
poi.2.follow.label=Die letzte Skizze naeher ansehen
poi.2.follow.text=Sie zeigt die Gruft von oben, mit Kreuzen an den Orten, wo etwas lauert.
poi.2.follow.attribute=INTELLIGENCE
poi.2.follow.effect=HINT
poi.2.follow.success=Du praegst dir die Kreuze ein und weisst, wo es gefaehrlich wird.
poi.2.follow.failure=Die Skizze zerfaellt, kaum dass du sie beruehrst.

poi.3.label=Die brodelnde Fluessigkeit untersuchen
poi.3.text=Sie blubbert in einem Kessel, und der Dampf ist violett.
poi.3.attribute=INTELLIGENCE
poi.3.easier=true
poi.3.effect=INSIGHT
poi.3.damage=true
poi.3.success=Du erkennst ein Gift und seine Gegenmittel und fuehlst dich besser geruestet gegen das, was kommt.
poi.3.failure=Eine Blase platzt dir ins Gesicht, und die Haut brennt.
