# Raum 5: der Thronsaal mit dem Endgegner.
name=Der Thronsaal

description.1=Kalte Fackeln saeumen einen Weg aus geborstenen Fliesen bis zum Thron.
description.2=Auf dem Thron sitzt, was einst ein Koenig war.
description.3=Es hebt langsam den Kopf. Es hat auf dich gewartet.

extra.potion.text=Am Eingang der Halle steht ein kleiner Trank, als haette ihn jemand fuer dich bereitgestellt.
