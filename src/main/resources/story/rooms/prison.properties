name=Das Verlies

description.1=Eiserne Gitter, verrostete Ketten, Knochen in den Ecken.
description.2=Irgendwo tropft Wasser, und irgendwo kratzt etwas an Stein.
description.3=In den Zellen liegen Strohsaecke, die seit Jahrhunderten niemand beruehrt hat.
description.4=Das Gitter zum naechsten Gang ist verschlossen.

free.label=Durch den offenen Gittergang weitergehen
free.text=Das Gitter steht offen, die Angeln sind laengst durchgerostet. Du gehst hindurch, und ein Kettenglied klirrt leise.

obstacle.label=Das verschlossene Gitter untersuchen
obstacle.text=Die Staebe sind dick, das Schloss rostig, aber noch intakt. Entweder du ueberlistest es oder du brichst es auf.

way.1.label=Das Schloss des Gitters knacken
way.1.attribute=DEXTERITY
way.1.harder=false
way.1.success=Der Rost bricht, das Schloss klickt, und das Gitter schwingt quietschend auf.
way.1.failure=Das Schloss gibt nach, aber das Gitter faellt dir beim Oeffnen auf den Fuss.

way.2.label=Das Gitter aufbrechen
way.2.attribute=STRENGTH
way.2.harder=true
way.2.success=Du stemmst die Staebe auseinander, und das Gitter gibt kreischend nach.
way.2.failure=Das Gitter bricht aus der Verankerung und schlaegt dir gegen die Schulter.

poi.1.label=Das geheime Fach in der Zellenwand suchen
poi.1.text=In einer Zelle hat jemand Striche in die Wand geritzt: Tage, Jahre, und dann nichts mehr.
poi.1.attribute=INTELLIGENCE
poi.1.effect=ITEM
poi.1.success=Hinter den Strichen ist ein Stein locker, und dahinter versteckt sich etwas.
poi.1.failure=Du tastest die Wand ab und findest nur Kratzer.

poi.2.label=Die Knochen in den Ecken betrachten
poi.2.text=Manche liegen in Ketten, andere vor der Tuer, als haette man sie hinausgezerrt.
poi.2.follow.label=Die Ketten der Gefangenen genauer untersuchen
poi.2.follow.text=Die Glieder sind nicht durchgerostet, sondern durchgebissen.
poi.2.follow.attribute=INTELLIGENCE
poi.2.follow.effect=HINT
poi.2.follow.success=Etwas hat sich hier durchgefressen und lebt vielleicht noch. Du weisst nun, womit du rechnen musst.
poi.2.follow.failure=Du verstehst nicht, was du siehst, und das macht es schlimmer.

poi.3.label=Den Strohsack in der naechsten Zelle durchwuehlen
poi.3.text=Etwas knistert darunter.
poi.3.attribute=DEXTERITY
poi.3.easier=true
poi.3.effect=INSIGHT
poi.3.damage=true
poi.3.success=Unter dem Stroh liegen ein rostiges Messer und ein Zettel mit dem Rat von jemandem, der es nicht geschafft hat.
poi.3.failure=Eine Ratte springt dich an und beisst zu.

extra.art=prison
