name=Der Statuensaal

description.1=Steinerne Gestalten stehen in zwei Reihen und starren auf die Tuer.
description.2=Jede traegt ein anderes Gesicht, und alle sehen aus, als wuerden sie lauschen.
description.3=Zwischen ihnen steht ein Sockel mit einer kleinen, verschlossenen Schatulle.
description.4=Am Ende des Saals fuehrt eine eisenbeschlagene Tuer weiter.

free.label=Durch die Reihe der Statuen zur Tuer gehen
free.text=Die Tuer steht offen. Du gehst zwischen den Statuen hindurch, und ihre Blicke bohren sich in deinen Ruecken.

obstacle.label=Die eisenbeschlagene Tuer untersuchen
obstacle.text=Die Tuer ist verriegelt, das Schloss alt, aber robust. Das Holz dahinter ist morsch.

way.1.label=Das Schloss der Tuer knacken
way.1.attribute=DEXTERITY
way.1.harder=false
way.1.success=Die Stifte fallen einer nach dem anderen, und die Tuer schwingt auf.
way.1.failure=Das Schloss schnappt zurueck und klemmt dir die Finger, bevor die Tuer doch nachgibt.

way.2.label=Die Tuer aufbrechen
way.2.attribute=STRENGTH
way.2.harder=true
way.2.success=Du wirfst dich gegen das Holz, und die Tuer birst. Der Weg ist frei.
way.2.failure=Die Tuer gibt nach, aber Splitter fliegen dir ins Gesicht, bevor du hindurch bist.

poi.1.label=Die kleine Schatulle auf dem Sockel oeffnen
poi.1.text=Sie ist nicht groesser als eine Hand, das Schloss kaum zu sehen.
poi.1.attribute=DEXTERITY
poi.1.effect=ITEM
poi.1.success=Das Schloss klickt, und der Deckel springt auf.
poi.1.failure=Die Schatulle bleibt verschlossen, und irgendwo im Saal knirscht Stein.

poi.2.label=Die Gesichter der Statuen betrachten
poi.2.text=Du gehst die Reihe ab. Jedes Gesicht traegt einen anderen Ausdruck: Furcht, Zorn, Trauer, und eines laechelt.
poi.2.follow.label=Das laechelnde Gesicht naeher untersuchen
poi.2.follow.text=Es sieht anders aus als die anderen, und seine Augen sind aus Glas.
poi.2.follow.attribute=INTELLIGENCE
poi.2.follow.effect=HINT
poi.2.follow.success=Es ist keine Statue, sondern ein Hueter, und du ahnst, womit du noch rechnen musst.
poi.2.follow.failure=Du fuehlst dich ploetzlich beobachtet und wendest dich ab.

poi.3.label=Den Sockel der Schatulle untersuchen
poi.3.text=In den Stein sind Kerben geritzt, wie Zaehne.
poi.3.attribute=DEXTERITY
poi.3.easier=true
poi.3.effect=INSIGHT
poi.3.damage=true
poi.3.success=Es sind Markierungen, die zeigen, wo man die Platten belasten darf. Du merkst dir den Rhythmus.
poi.3.failure=Ein Stein gibt nach, und ein stumpfer Pfeil streift dich.
