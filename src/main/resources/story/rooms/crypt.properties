name=Die Gruft

description.1=Steinsaerge saeumen die Waende, die meisten Deckel sind verschoben.
description.2=Es riecht nach feuchter Erde und nach etwas Schlimmerem.
description.3=Zwischen den Saergen liegen Opfergaben, lange zu Asche zerfallen.
description.4=Ein Sarkophag steht quer vor dem einzigen Ausgang.

free.label=An den Saergen vorbei zum Ausgang gehen
free.text=Der Weg zwischen den Saergen ist frei. Du gehst schnell und siehst weder nach links noch nach rechts.

obstacle.label=Den Sarkophag vor dem Ausgang untersuchen
obstacle.text=Der Sarkophag ist mit Siegelrunen versiegelt und mit Steinplatten beschwert. Entweder du verstehst das Siegel, oder du stemmst den Deckel auf.

way.1.label=Die Siegelrunen am Sarkophag entziffern
way.1.attribute=INTELLIGENCE
way.1.harder=false
way.1.success=Die Runen verblassen eine nach der anderen, und der Deckel gleitet beiseite. Dahinter fuehrt eine Treppe nach oben.
way.1.failure=Eine Rune bleibt stehen und brennt sich in deine Handflaeche, bevor der Sarkophag sich oeffnet. Du stuermst hindurch.

way.2.label=Den Sarkophag zur Seite stemmen
way.2.attribute=STRENGTH
way.2.harder=true
way.2.success=Du stemmst dich gegen den Stein, und er schrammt knirschend zur Seite. Der Weg ist frei.
way.2.failure=Der Stein rutscht dir auf die Beine, bevor er endlich weicht. Du humpelst hindurch.

poi.1.label=Den Toten am Boden durchsuchen
poi.1.text=Ein Gerippe in verrosteter Ruestung lehnt an der Wand, die Knochenfinger noch um etwas geschlossen.
poi.1.attribute=DEXTERITY
poi.1.effect=ITEM
poi.1.success=Du loest die Finger vorsichtig, und etwas faellt dir in die Hand.
poi.1.failure=Die Knochen zerfallen zu Staub, und was sie hielten, rutscht in einen Spalt.

poi.2.label=Die Inschrift an der Wand lesen
poi.2.text=Eingemeisselt in den Stein: der Name des Koenigs und eine lange Liste derer, die ihm folgten.
poi.2.follow.label=Die Liste der Namen genauer ansehen
poi.2.follow.text=Die letzten Namen sind frisch eingeritzt, und manche kennst du.
poi.2.follow.attribute=INTELLIGENCE
poi.2.follow.effect=HINT
poi.2.follow.success=Du erkennst, dass der Koenig seine Treuen mit Wachen versehen hat, und weisst nun besser, was vor dir liegt.
poi.2.follow.failure=Die Namen verschwimmen vor deinen Augen. Dir ist, als flueserte jemand sie nach.

poi.3.label=Einen der Saerge oeffnen
poi.3.text=Ein Deckel liegt schief, und darunter blitzt etwas.
poi.3.attribute=STRENGTH
poi.3.easier=true
poi.3.effect=INSIGHT
poi.3.damage=true
poi.3.success=Der Tote darin liegt mit dem Gesicht zur Tuer, die Haende gefaltet. Du verstehst die Ordnung dieser Gruft.
poi.3.failure=Der Deckel rutscht ab und schlaegt dir auf die Finger.
