name=Die Bibliothek

description.1=Regale ragen bis in die Dunkelheit, und die Buecher darin zerfallen zu Staub, sobald dein Licht sie streift.
description.2=Zwischen den Gaengen haengen Spinnweben schwer wie Vorhaenge.
description.3=Auf den wenigen heilen Seiten glimmen Runen, als wuerden sie dich beobachten.
description.4=Am anderen Ende der Halle wartet ein schweres Tor.

free.label=Zwischen den Regalen hindurch zum Tor gehen
free.text=Das Tor steht einen Spalt offen, und du zwaengst dich hindurch. Hinter dir fluestern die Buecher weiter.

obstacle.label=Das schwere Tor untersuchen
obstacle.text=Das Tor ist mit Runen versiegelt, und das Schloss ist ein Meisterwerk aus Eisen. Beides laesst sich bezwingen, auf eigene Gefahr.

way.1.label=Die Siegelrunen am Tor entziffern
way.1.attribute=INTELLIGENCE
way.1.harder=false
way.1.success=Die Runen ordnen sich vor deinen Augen zu einem Satz, und das Tor schwingt lautlos auf.
way.1.failure=Du sprichst die Worte falsch aus, und ein Funkenregen faehrt aus dem Tor. Es oeffnet sich trotzdem, nur nicht freiwillig.

way.2.label=Das Schloss des Tores knacken
way.2.attribute=DEXTERITY
way.2.harder=true
way.2.success=Der Dietrich findet den letzten Stift, und das Schloss gibt mit einem Seufzer nach.
way.2.failure=Der Dietrich bricht, und eine Nadel schiesst aus dem Schloss. Du stoesst das Tor auf und stolperst hindurch.

poi.1.label=Die Runen auf den zerfallenen Seiten lesen
poi.1.text=Ein einziges Blatt hat die Jahre ueberstanden, die Tinte darauf schimmert silbern.
poi.1.attribute=INTELLIGENCE
poi.1.effect=ITEM
poi.1.success=Zwischen den Zeilen steckt etwas, das jemand hier versteckt hat.
poi.1.failure=Die Schrift verschwimmt, und das Blatt zerfaellt in deinen Haenden.

poi.2.label=Das Lesepult mit dem offenen Buch betrachten
poi.2.text=Auf dem Pult liegt ein Buch, aufgeschlagen, als haette man es mitten im Satz verlassen. Die letzte Seite ist feucht.
poi.2.follow.label=Die feuchte Seite genauer lesen
poi.2.follow.text=Die Tinte ist frisch. Jemand hat hier vor kurzem geschrieben.
poi.2.follow.attribute=INTELLIGENCE
poi.2.follow.effect=INSIGHT
poi.2.follow.success=Die Notizen sind Warnung und Rat zugleich, und du verstehst die Eigenheiten dieses Ortes besser.
poi.2.follow.failure=Die Worte ergeben keinen Sinn, und ein kalter Hauch faehrt dir ueber den Nacken.

poi.3.label=Die untersten Regalbretter durchstoebern
poi.3.text=Hinter einem Stapel Buecher glaubst du etwas Metallisches zu sehen.
poi.3.attribute=DEXTERITY
poi.3.easier=true
poi.3.effect=HINT
poi.3.damage=true
poi.3.success=Es ist ein Kompass ohne Nadel, doch auf seiner Rueckseite sind Skizzen eingeritzt, die den Weg weiter beschreiben.
poi.3.failure=Das Regal kippt ein Stueck, und ein Schwall schwerer Buecher faellt dir auf die Schulter.

extra.art=library
