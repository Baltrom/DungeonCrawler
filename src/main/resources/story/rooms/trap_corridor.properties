name=Der Fallengang

description.1=Ein langer Gang, der Boden uebersaet mit Platten, die leicht einsinken.
description.2=An den Waenden Kratzspuren und dunkle Flecken.
description.3=Irgendwo klickt es, leise und regelmaessig.
description.4=Am Ende des Gangs fuehrt ein Durchbruch weiter.

free.label=Den Gang entlang zum Durchbruch gehen
free.text=Die Platten sind eingerastet, und du gehst unbehelligt den Gang entlang. Das Klicken verstummt hinter dir.

obstacle.label=Den Gang und seine Platten untersuchen
obstacle.text=Nicht jede Platte loest etwas aus, aber die falsche tut es mit Sicherheit. Entweder du springst darueber hinweg oder du suchst das Muster.

way.1.label=Ueber die Druckplatten springen
way.1.attribute=DEXTERITY
way.1.harder=false
way.1.success=Du federst von Stein zu Stein, und nichts rastet ein. Am Ende des Gangs landest du sicher.
way.1.failure=Eine Platte sinkt unter dir ein, und Pfeile zischen aus der Wand. Du rettest dich mit einem Satz.

way.2.label=Das Muster der Platten erkennen
way.2.attribute=INTELLIGENCE
way.2.harder=true
way.2.success=Die Kratzspuren folgen einem Rhythmus, und du setzt die Fuesse genau dorthin. Der Weg ist frei.
way.2.failure=Du verrechnest dich um eine Platte, und die Wand schnellt vor. Du kommst gerade noch davon.

poi.1.label=Das geheime Fach in der Wand suchen
poi.1.text=Eine Fuge in der Wand ist breiter als die anderen.
poi.1.attribute=INTELLIGENCE
poi.1.effect=ITEM
poi.1.success=Ein Stein laesst sich eindruecken, und dahinter liegt etwas verborgen.
poi.1.failure=Die Fuge ist nur ein Riss, und du findest nichts.

poi.2.label=Die Kratzspuren an den Waenden ansehen
poi.2.text=Sie sind tief und verzweifelt. Manche fuehren in Gruppen zurueck zur Tuer, andere hoeren mitten im Gang auf.
poi.2.follow.label=Den Spuren folgen, wo sie enden
poi.2.follow.text=Dort, wo sie aufhoeren, ist die Wand glatt gescheuert.
poi.2.follow.attribute=INTELLIGENCE
poi.2.follow.effect=INSIGHT
poi.2.follow.success=Ein Muster zeichnet sich ab: Die Opfer sind immer auf dieselbe Weise gestorben. Du kennst nun die Schwachstelle des Gangs.
poi.2.follow.failure=Du starrst auf die Wand, bis dir schwindelig wird.

poi.3.label=Eine der Platten vorsichtig anheben
poi.3.text=Sie sitzt locker, und unter ihr glimmt etwas.
poi.3.attribute=DEXTERITY
poi.3.easier=true
poi.3.effect=HINT
poi.3.damage=true
poi.3.success=Unter der Platte liegt ein Zettel mit einer Warnung, die dir verraet, was dich spaeter erwartet.
poi.3.failure=Die Platte rutscht ab und quetscht dir die Hand.

extra.art=trap_corridor
