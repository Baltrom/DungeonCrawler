# Stimmungstexte. Zu jedem Schluessel gibt es Varianten (.1, .2, ...), eine wird zufaellig gewaehlt.
# Platzhalter: {enemy} = Name des Gegners, {room} = Name des Raums. Nur ASCII (ae, oe, ue, ss).

# --- Fallen ---
trap.hit.1=Die Falle trifft dich hart, aber nicht toedlich.
trap.hit.2=Metall streift dich, und der Schmerz folgt einen Atemzug spaeter.
trap.fumble.1=Du hast die Falle voellig unterschaetzt, und sie schlaegt mit voller Wucht zu.
trap.fumble.2=Ein falscher Griff, und die ganze Mechanik entlaedt sich auf einmal.
trap.dead.1=Die Verletzungen sind zu schwer, und die Gruft verschluckt dein letztes Aufstoehnen.
trap.dead.2=Du sinkst zu Boden, und das Letzte, was du siehst, ist der kalte Stein.
trap.survive.1=Blutend und fluchend kaempfst du dich weiter.
trap.survive.2=Du presst die Zaehne zusammen und gehst weiter, denn Stehenbleiben ist keine Option.

# --- Beute ---
loot.empty.1=Das Versteck ist leer. Jemand war vor dir hier.
loot.empty.2=Nichts, nur Staub und der Abdruck von etwas, das einmal hier lag.

# --- Schluessel, Traenke, Zauber ausserhalb des Kampfes ---
key.use.1=Der Schluessel dreht sich knirschend im Schloss und zerbricht, doch der Weg ist offen.
key.use.2=Das Metall singt leise, dann zerfaellt der Schluessel zu Rost. Der Weg ist frei.
potion.heal.1=Der Trank schmeckt nach Kraeutern und Eisen, und die Wunden schliessen sich.
potion.heal.2=Waerme breitet sich in dir aus, und der Schmerz weicht.
potion.charge.1=Der Trank prickelt auf der Zunge, und in deinen Haenden knistert wieder Magie.
spell.arcane.1=Die Runen leuchten auf, und die Dunkelheit zieht sich einen Schritt zurueck.
spell.arcane.2=Dein Blick wird klar und scharf, und selbst der Staub scheint dir seine Geheimnisse zuzufluestern.

# --- Fund jedes Items ---
item.found.HEALING_POTION.1=Ein kleines Glasfaeschchen, in dem etwas Rotes schimmert.
item.found.CHARGE_POTION.1=Ein Flakon, in dem blaues Licht wie Nebel wabert.
item.found.RING_OF_LIFE.1=Ein schlichter Ring, der in deiner Hand erstaunlich warm ist.
item.found.RING_OF_WISDOM.1=Ein Ring mit einem Stein, in dem sich Buchstaben zu bewegen scheinen.
item.found.BOOTS_OF_SHADOWS.1=Weiche Stiefel, die keinen Laut machen, wenn du sie beruehrst.
item.found.STRENGTH_BELT.1=Ein schwerer Guertel, dessen Schnalle wie eine Faust geformt ist.
item.found.PROTECTION_AMULET.1=Ein kleines Amulett an einer Kette, in das ein Schutzzeichen geritzt ist.
item.found.MAGIC_DAGGER.1=Ein schmaler Dolch, dessen Klinge im Dunkeln leise leuchtet.
item.found.IRON_KEY.1=Ein schwerer Eisenschluessel, dessen Bart wie ein Zahn gezackt ist.

# --- Begegnungen ---
encounter.ordinary.1=Aus den Schatten loest sich ein {enemy}, und seine Knochen klappern leise.
encounter.ordinary.2=Etwas Hartes schabt ueber den Boden, und ein {enemy} dreht sich langsam zu dir um.
encounter.boss.1=Der tote Koenig erhebt sich vom Thron, und die Luft wird so kalt, dass dein Atem gefriert.
encounter.sneak.rogue.1=Du schleichst dich von hinten an, lautlos wie ein Schatten.
encounter.sneak.rogue.2=Du gleitest durch die Dunkelheit, und der Gegner ahnt nichts.
encounter.sneak.other.1=Du tastest dich an der Wand entlang und kommst unbemerkt nah heran.
encounter.spy.1=Du beobachtest die Bewegungen des Gegners und erkennst den richtigen Moment.
encounter.spy.2=Dein Blick findet die Schwachstelle, noch bevor der Gegner dich bemerkt.
encounter.noticed.1=Ein Knochen knackt unter deinem Fuss, und der Gegner dreht sich um.
encounter.noticed.2=Dein Schatten faellt zur falschen Zeit an die Wand, und du wirst bemerkt.

# --- Die Statue (besonderer Gegner) ---
statue.label.1=Die Statue in der Nische untersuchen
statue.look.1=In einer Nische hockt eine steinerne Gestalt mit Fluegeln und leeren Augen. Der Stein ist feucht, als wuerde er atmen.
statue.success.1=Du erkennst die Zeichen auf dem Sockel und weisst, wann die Statue erwacht. Du bist bereit.
statue.fail.1=Die Statue erwacht, kaum dass du sie beruehrst, und der Stein knirscht.
statue.defeated.1=Die Gargoyle zerfaellt zu Geroell, und zwischen den Brocken blitzt etwas auf.

# --- Hinweise auf den naechsten Raum ---
hint.boss.1=Aus der Tiefe dringen Kaelte und ein Fluestern, das deinen Namen kennt. Dort wartet etwas Maechtiges, und es ist der letzte Raum.
hint.ordinary.1=Dahinter hoerst du ein Schlurfen und das Klappern von Knochen. Dort wartet ein Gegner.
hint.ordinary.2=Aus dem naechsten Raum dringt ein leises Scharren. Etwas Totes ist dort noch unterwegs.
hint.special.1=Dahinter steht etwas Steinernes, das seit Jahrhunderten regungslos wartet.
hint.room.1=Die Anzeichen sprechen dafuer, dass dahinter {room} liegt.
hint.room.2=Du ahnst, was dich erwartet: {room}.
hint.blocked.1=Der Durchgang dort scheint versperrt zu sein.
hint.blocked.2=Du wirst dort wohl ein Hindernis bezwingen muessen.
hint.free.1=Der Weg dorthin sollte frei sein.
hint.free.2=Ein Hindernis ist nicht zu erwarten.

# --- Kampf ---
combat.hit.mage.1=Dein Zauberstab spruht Funken, und der Treffer sitzt.
combat.hit.mage.2=Ein Faden aus Licht faehrt aus deinem Stab und trifft sein Ziel.
combat.hit.mage.3=Du sprichst ein Wort der Macht, und es schlaegt ein.
combat.miss.mage.1=Dein Zauber zischt am Ziel vorbei und verglueht im Dunkeln.
combat.miss.mage.2=Die Worte stolpern dir von der Zunge, und der Funke geht ins Leere.
combat.hit.rogue.1=Deine Klinge findet die Luecke in der Deckung.
combat.hit.rogue.2=Ein schneller Stich, und das Metall trifft Fleisch oder Knochen.
combat.hit.rogue.3=Du tauchst unter dem Hieb weg und stichst zu.
combat.miss.rogue.1=Dein Stich geht ins Leere, und du verlierst fast das Gleichgewicht.
combat.miss.rogue.2=Der Gegner weicht aus, und deine Klinge schneidet nur Luft.
combat.ambush.1=Du kommst aus der Dunkelheit, und der Gegner hat keine Chance, sich zu wehren.
combat.ambush.2=Der erste Stich kommt von hinten und sitzt tief.
combat.fireball.1=Du schleuderst einen Feuerball, der die Dunkelheit zerreisst. Er trifft immer.
combat.fireball.2=Eine Kugel aus Flammen faehrt aus deiner Hand und schlaegt mit einem Fauchen ein.
combat.shield.1=Ein Schild aus Licht umgibt dich und summt leise.
combat.shield.2=Die Luft vor dir verdichtet sich zu einer schimmernden Wand.
combat.enemyhit.1={enemy} trifft dich hart, und der Schmerz laesst dich taumeln.
combat.enemyhit.2={enemy} reisst dich mit einem Hieb fast von den Fuessen.
combat.enemyhit.3=Ein Schlag von {enemy} trifft dich, und du schmeckst Blut.
combat.enemymiss.1={enemy} schlaegt knapp an dir vorbei.
combat.enemymiss.2=Du weichst im letzten Moment aus.
combat.enemymiss.3=Der Hieb von {enemy} pfeift an deinem Ohr vorbei.
combat.win.skeleton.1=Das Skelett faellt klappernd in sich zusammen, und die Stille kehrt zurueck.
combat.win.gargoyle.1=Der Stein bricht, und die Gargoyle sackt als Haufen Geroell in sich zusammen.
combat.win.king.1=Der Koenig stoesst einen langen Seufzer aus, und sein Koerper zerfaellt zu Staub.
combat.win.default.1=Dein Gegner bricht zusammen, und du atmest auf.
combat.lose.1=Alles wird dunkel, und das Letzte, was du hoerst, ist ein leises Fluestern.
combat.lose.2=Deine Knie geben nach, und die Gruft schliesst sich um dich.
